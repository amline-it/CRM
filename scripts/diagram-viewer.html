<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مرورگر دیاگرام‌های CRM املاک</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --ink: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #1d4ed8; --accent-soft: #dbeafe; --ok: #15803d; --warn: #b45309;
  }
  [data-theme="dark"] {
    --bg: #0b1220; --panel: #111a2e; --ink: #e2e8f0; --muted: #94a3b8;
    --line: #22304d; --accent: #60a5fa; --accent-soft: #172554; --ok: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Vazirmatn, Tahoma, system-ui, sans-serif; font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button, select, input {
    font-family: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; filter: brightness(1.08); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 53px); }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 10px; }
  aside input[type="search"] { width: 100%; margin-bottom: 8px; }
  .item {
    display: block; width: 100%; text-align: right; padding: 8px 10px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink);
  }
  .item:hover { border-color: var(--accent); color: var(--ink); }
  .item.active { background: var(--accent-soft); border-color: var(--accent); }
  .item .name { font-weight: 700; font-size: 13px; line-height: 1.6; }
  .item .meta { color: var(--muted); font-size: 11px; direction: ltr; text-align: right; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 10.5px; margin-left: 4px; }
  section.view { display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .toolbar .title { font-weight: 700; font-size: 13.5px; }
  .toolbar .zoom { color: var(--muted); font-size: 12px; min-width: 52px; text-align: center; direction: ltr; }
  .canvas { flex: 1; overflow: hidden; position: relative; background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 22px 22px; }
  .stage { position: absolute; inset: 0; overflow: auto; }
  .stage .inner { transform-origin: top right; padding: 24px; display: inline-block; min-width: 100%; }
  .stage svg { max-width: none !important; height: auto; }
  pre.source {
    margin: 0; padding: 16px; overflow: auto; background: var(--panel); color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.9;
    direction: ltr; text-align: left; white-space: pre; height: 100%;
  }
  .status { padding: 24px; color: var(--muted); }
  .error { padding: 16px; margin: 16px; border: 1px solid #b91c1c; background: #fee2e2; color: #7f1d1d; border-radius: 10px; white-space: pre-wrap; direction: ltr; text-align: left; font-family: monospace; font-size: 12px; }
  .hint { color: var(--muted); font-size: 11.5px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; background: var(--bg); }
</style>
</head>
<body>
<header>
  <h1>دیاگرام‌های CRM املاک</h1>
  <span class="sub">Mermaid — رندر در مرورگر شما</span>
  <span class="spacer"></span>
  <select id="theme">
    <option value="light">روشن</option>
    <option value="dark">تیره</option>
  </select>
  <button id="reload">بازخوانی فهرست</button>
</header>

<main>
  <aside>
    <input type="search" id="search" placeholder="جست‌وجو در عنوان یا نام فایل…" />
    <div id="list"></div>
  </aside>

  <section class="view">
    <div class="toolbar">
      <span class="title" id="current">—</span>
      <span class="tag" id="type"></span>
      <span class="spacer"></span>
      <button data-zoom="out">−</button>
      <span class="zoom" id="zoomLabel">100%</span>
      <button data-zoom="in">+</button>
      <button data-zoom="fit">اندازه مناسب</button>
      <button data-zoom="reset">۱:۱</button>
      <button id="toggleSource">نمایش منبع</button>
      <button id="copy">کپی منبع</button>
      <button id="dlMmd">دانلود .mmd</button>
      <button id="dlSvg">خروجی SVG</button>
      <button id="dlPng" class="primary">خروجی PNG</button>
    </div>
    <div class="canvas">
      <div class="stage" id="stage"><div class="inner" id="inner"><div class="status" id="status">در حال بارگذاری Mermaid…</div></div></div>
    </div>
    <div class="hint">
      <kbd>↑</kbd>/<kbd>↓</kbd> جابه‌جایی بین دیاگرام‌ها · <kbd>+</kbd>/<kbd>−</kbd> بزرگ‌نمایی ·
      چرخ ماوس = پیمایش · کشیدن با ماوس = جابه‌جایی نمودار · منبع: <span dir="ltr">docs/diagrams/*.mmd</span>
    </div>
  </section>
</main>

<script type="module">
// اول نسخه محلی (npm run diagrams:vendor)، بعد CDNها
const CDNS = [
  "/vendor/mermaid.esm.min.mjs",
  "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs",
  "https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs",
];

const els = {
  list: document.getElementById("list"),
  search: document.getElementById("search"),
  current: document.getElementById("current"),
  type: document.getElementById("type"),
  inner: document.getElementById("inner"),
  stage: document.getElementById("stage"),
  status: document.getElementById("status"),
  zoomLabel: document.getElementById("zoomLabel"),
  theme: document.getElementById("theme"),
};

let mermaid = null;
let diagrams = [];
let active = null;
let rawText = "";
let scale = 1;
let showSource = false;

const baseConfig = (theme) => ({
  startOnLoad: false,
  securityLevel: "loose",
  theme,
  themeVariables: { fontFamily: "Vazirmatn, Tahoma, sans-serif", fontSize: "14px" },
  flowchart: { htmlLabels: true, useMaxWidth: false, curve: "basis" },
  sequence: { useMaxWidth: false, mirrorActors: false },
  er: { useMaxWidth: false },
  state: { useMaxWidth: false },
  mindmap: { useMaxWidth: false },
});

async function loadMermaid() {
  for (const url of CDNS) {
    try {
      const mod = await import(/* @vite-ignore */ url);
      return mod.default ?? mod;
    } catch (err) {
      console.warn("CDN ناموفق:", url, err);
    }
  }
  throw new Error("بارگذاری Mermaid از CDN ممکن نشد (اتصال اینترنت مرورگر لازم است)");
}

function applyConfig(extra = {}) {
  mermaid.initialize({ ...baseConfig(els.theme.value), ...extra });
}

async function loadList() {
  const res = await fetch("/api/diagrams");
  const data = await res.json();
  diagrams = data.diagrams ?? [];
  renderList();
}

function renderList() {
  const q = els.search.value.trim().toLowerCase();
  els.list.innerHTML = "";
  for (const item of diagrams) {
    if (q && !(`${item.title} ${item.file}`.toLowerCase().includes(q))) continue;
    const button = document.createElement("button");
    button.className = `item${active === item.file ? " active" : ""}`;
    button.innerHTML = `<div class="name">${escapeHtml(item.title)}</div>
      <div class="meta">${item.file} · <span class="tag">${item.type}</span> ${item.lines} خط</div>`;
    button.onclick = () => select(item.file);
    els.list.appendChild(button);
  }
  if (!els.list.children.length) {
    els.list.innerHTML = `<div class="status">موردی یافت نشد.</div>`;
  }
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function select(file) {
  active = file;
  location.hash = file;
  renderList();
  const item = diagrams.find((d) => d.file === file);
  els.current.textContent = item ? item.title : file;
  els.type.textContent = item ? item.type : "";
  els.status.style.display = "block";
  els.status.textContent = "در حال رندر…";
  els.inner.querySelectorAll("svg,pre,.error").forEach((n) => n.remove());
  try {
    rawText = await (await fetch(`/raw/${encodeURIComponent(file)}`)).text();
    if (showSource) return renderSource();
    const { svg } = await mermaid.render(`d_${Date.now()}`, rawText);
    els.status.style.display = "none";
    const holder = document.createElement("div");
    holder.innerHTML = svg;
    els.inner.appendChild(holder.firstElementChild);
    fit();
  } catch (err) {
    els.status.style.display = "none";
    const box = document.createElement("div");
    box.className = "error";
    box.textContent = `خطا در رندر ${file}\n${err?.message ?? err}`;
    els.inner.appendChild(box);
  }
}

function renderSource() {
  els.status.style.display = "none";
  const pre = document.createElement("pre");
  pre.className = "source";
  pre.textContent = rawText;
  els.inner.appendChild(pre);
}

function setScale(next) {
  scale = Math.min(6, Math.max(0.1, next));
  els.inner.style.transform = `scale(${scale})`;
  els.zoomLabel.textContent = `${Math.round(scale * 100)}%`;
}

function fit() {
  const svg = els.inner.querySelector("svg");
  if (!svg) return setScale(1);
  const width = svg.getBoundingClientRect().width / scale || svg.viewBox?.baseVal?.width || 1;
  const available = els.stage.clientWidth - 48;
  setScale(Math.min(2, Math.max(0.15, available / width)));
}

document.querySelectorAll("[data-zoom]").forEach((btn) => {
  btn.onclick = () => {
    const mode = btn.dataset.zoom;
    if (mode === "in") setScale(scale * 1.2);
    else if (mode === "out") setScale(scale / 1.2);
    else if (mode === "reset") setScale(1);
    else fit();
  };
});

document.getElementById("toggleSource").onclick = (e) => {
  showSource = !showSource;
  e.target.textContent = showSource ? "نمایش نمودار" : "نمایش منبع";
  if (active) select(active);
};

document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(rawText); flash("منبع کپی شد"); }
  catch { flash("کپی ممکن نشد"); }
};

document.getElementById("dlMmd").onclick = () => download(new Blob([rawText], { type: "text/plain;charset=utf-8" }), active);

document.getElementById("dlSvg").onclick = () => {
  const svg = els.inner.querySelector("svg");
  if (!svg) return flash("ابتدا نمودار را رندر کنید");
  download(new Blob([serializeSvg(svg)], { type: "image/svg+xml;charset=utf-8" }), active.replace(/\.mmd$/, ".svg"));
};

document.getElementById("dlPng").onclick = async () => {
  if (!rawText) return flash("ابتدا یک دیاگرام را باز کنید");
  const btn = document.getElementById("dlPng");
  btn.disabled = true;
  btn.textContent = "در حال ساخت PNG…";
  try {
    // برای سازگاری با canvas، برچسب‌های HTML خاموش و متن به‌صورت SVG رندر می‌شود
    applyConfig({ flowchart: { htmlLabels: false, useMaxWidth: false }, securityLevel: "strict" });
    const { svg } = await mermaid.render(`png_${Date.now()}`, rawText);
    applyConfig();
    const blob = await svgToPng(svg, 2);
    download(blob, active.replace(/\.mmd$/, ".png"));
    flash("PNG ذخیره شد");
  } catch (err) {
    flash(`خطا در خروجی PNG: ${err?.message ?? err}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "خروجی PNG";
  }
};

function serializeSvg(svg) {
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
  const box = svg.getBoundingClientRect();
  if (box.width && box.height) {
    clone.setAttribute("width", Math.ceil(box.width / scale));
    clone.setAttribute("height", Math.ceil(box.height / scale));
  }
  return `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(clone)}`;
}

function svgToPng(svgText, factor = 2) {
  return new Promise((resolve, reject) => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgText, "image/svg+xml");
    const svgEl = doc.documentElement;
    const vb = svgEl.viewBox?.baseVal;
    const width = vb?.width || svgEl.getBoundingClientRect?.().width || 1200;
    const height = vb?.height || svgEl.getBoundingClientRect?.().height || 800;
    svgEl.setAttribute("width", width);
    svgEl.setAttribute("height", height);
    const data = new XMLSerializer().serializeToString(svgEl);
    const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(data)}`;
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(width * factor);
      canvas.height = Math.ceil(height * factor);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = els.theme.value === "dark" ? "#0b1220" : "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("canvas.toBlob ناموفق بود"))), "image/png");
    };
    img.onerror = () => reject(new Error("بارگذاری SVG در Image ناموفق بود"));
    img.src = url;
  });
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

let flashTimer = null;
function flash(message) {
  els.status.style.display = "block";
  els.status.textContent = message;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { els.status.style.display = "none"; }, 2600);
}

// پیمایش با کشیدن ماوس
let dragging = false;
let start = { x: 0, y: 0, left: 0, top: 0 };
els.stage.addEventListener("mousedown", (e) => {
  if (e.target.closest("pre")) return;
  dragging = true;
  start = { x: e.clientX, y: e.clientY, left: els.stage.scrollLeft, top: els.stage.scrollTop };
  els.stage.style.cursor = "grabbing";
});
window.addEventListener("mouseup", () => { dragging = false; els.stage.style.cursor = ""; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  els.stage.scrollLeft = start.left - (e.clientX - start.x);
  els.stage.scrollTop = start.top - (e.clientY - start.y);
});
els.stage.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
}, { passive: false });

els.search.oninput = renderList;
els.theme.onchange = () => {
  document.documentElement.dataset.theme = els.theme.value;
  applyConfig();
  if (active && !showSource) select(active);
};
document.getElementById("reload").onclick = async () => { await loadList(); if (active) select(active); };

window.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  const index = diagrams.findIndex((d) => d.file === active);
  if (e.key === "ArrowDown" || e.key === "j") { if (diagrams[index + 1]) select(diagrams[index + 1].file); }
  else if (e.key === "ArrowUp" || e.key === "k") { if (index > 0) select(diagrams[index - 1].file); }
  else if (e.key === "+" || e.key === "=") setScale(scale * 1.2);
  else if (e.key === "-") setScale(scale / 1.2);
  else if (e.key === "0") fit();
});

try {
  mermaid = await loadMermaid();
  applyConfig();
  await loadList();
  const wanted = decodeURIComponent(location.hash.slice(1));
  const first = diagrams.find((d) => d.file === wanted) ?? diagrams[0];
  if (first) await select(first.file);
  else els.status.textContent = "فایلی در docs/diagrams پیدا نشد.";
} catch (err) {
  els.status.style.display = "none";
  const box = document.createElement("div");
  box.className = "error";
  box.textContent = `${err?.message ?? err}\n\nاگر این صفحه را داخل پیش‌نمایش Arena می‌بینید، مطمئن شوید مرورگرتان به CDN دسترسی دارد.`;
  els.inner.appendChild(box);
}
</script>
</body>
</html>
